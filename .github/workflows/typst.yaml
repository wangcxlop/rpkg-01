name: Typst documentation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
      - name: Install Chinese font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Compile component documentation
        run: typst compile docs/component.typ /tmp/component.pdf
